version: 2
updates:
  - package-ecosystem: gomod
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
