name: CI

on:
  workflow_dispatch:
  # main requires an up-to-date branch, so the pull request run already
  # tested the merged code. Run on main only when dependencies change, to
  # refresh the caches pull requests read.
  push:
    branches: [main]
    paths:
      - go.sum
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py
      - name: Block personal details
        run: python3 scripts/ci/check-private-info.py

  qa-select:
    name: Select risk-based QA contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
      agent_cross_platform: ${{ steps.select.outputs.agent_cross_platform }}
      agent_installed_container: ${{ steps.select.outputs.agent_installed_container }}
      selected_json: ${{ steps.select.outputs.selected_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test QA contract selector
        run: python3 -B -m unittest scripts/ci/test_select_qa_contracts.py scripts/ci/test_ci_result.py

      - name: Select contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_MODE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          selector=(python3 scripts/ci/select-qa-contracts.py)
          if [[ "${FULL_MODE}" == "true" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            selector+=(--full)
          else
            selector+=(--base "${BASE_SHA}" --head "${GITHUB_SHA}")
          fi
          "${selector[@]}"

  go-checks:
    needs: [line-limit, qa-select]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require source-size and selection gates
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
          SELECTION_RESULT: ${{ needs.qa-select.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
          test "${SELECTION_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Check formatting
        if: needs.qa-select.outputs.checks_required != 'false'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go vet ./...
        name: Vet
        if: needs.qa-select.outputs.checks_required != 'false'
      # The terminal tests drive a real tmux; without it they skip.
      - name: Install tmux
        if: needs.qa-select.outputs.checks_required != 'false'
        run: sudo apt-get install -y --no-install-recommends tmux
      - run: go test -race ./...
        name: Race test
        if: needs.qa-select.outputs.checks_required != 'false'
      - run: go build ./cmd/labtether-agent/
        name: Build
        if: needs.qa-select.outputs.checks_required != 'false'
      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
          CHECKS_REQUIRED: ${{ needs.qa-select.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          fi
          # actionlint and gitleaks are release binaries pinned by SHA-256.
          # Building both from source took about 40 seconds on every run.
          fetch_tool() {
            local binary="$1" sha="$2" url="$3"
            local archive="${RUNNER_TEMP}/${binary}.tar.gz"
            curl --fail --location --silent --show-error --retry 3 \
              "${url}" --output "${archive}"
            echo "${sha}  ${archive}" | sha256sum --check --quiet
            mkdir -p "${GOBIN}"
            tar -xzf "${archive}" -C "${GOBIN}" "${binary}"
          }
          fetch_tool actionlint \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          fetch_tool gitleaks \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Go security scan
        if: needs.qa-select.outputs.checks_required != 'false'
        run: bash ./scripts/check-gosec-allowlist.sh
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Enforce binary release and signing policy
        run: |
          bash ./scripts/release/test-workflow-policy.sh
          bash ./scripts/release/test-workflow-policy-cases.sh
      - name: Scan current source for secrets
        run: gitleaks dir . --no-banner --redact --timeout 300

  cross-build:
    needs: qa-select
    if: needs.qa-select.outputs.checks_required != 'false' && needs.qa-select.outputs.agent_cross_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Compile ${{ matrix.goos }}/${{ matrix.goarch }} source and tests
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o /tmp/labtether-agent-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/labtether-agent
          mkdir -p /tmp/labtether-agent-test-binaries
          go test -c -o /tmp/labtether-agent-test-binaries/ ./...

  installed-container:
    name: Contract / Installed Linux container
    needs: qa-select
    if: needs.qa-select.outputs.checks_required != 'false' && needs.qa-select.outputs.agent_installed_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runnable agent image
        run: |
          docker build \
            --build-arg "VERSION=ci-${GITHUB_SHA}" \
            --tag labtether-agent:qa-contract \
            .
      - name: Validate packaged entrypoint and non-root runtime
        run: |
          docker run --rm labtether-agent:qa-contract help |
            grep -Fx "labtether-agent ci-${GITHUB_SHA}"
          docker run --rm --entrypoint /bin/sh labtether-agent:qa-contract \
            -eu -c 'test "$(id -u)" = 1001'
          docker run --rm --entrypoint /bin/sh labtether-agent:qa-contract \
            -eu -c 'test "$LABTETHER_TOKEN_FILE" = /var/lib/labtether/agent-token && touch /var/lib/labtether/write-probe'

  ci-result:
    name: CI result
    needs: [line-limit, qa-select, go-checks, cross-build, installed-container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/check-ci-result.py
