name: Sign Release Binaries

# Started by hand from main for one tag. Two jobs:
# - build checks out the tag and builds the four raw agent binaries. It has no
#   access to the release key.
# - sign checks out only this workflow's own commit (trusted), builds the
#   signer and reads the expected public key from it, checks the tag links the
#   same public key, downloads the build job's binaries, checks their SHA-256
#   against the build job's output, and signs them. No code from the tag runs
#   in this job.
# The result is a one-day workflow artifact with the signatures, metadata,
# checksums and CI binaries. It creates no release, tag or package. The private
# key reaches the signer only on stdin.
# See docs/RELEASE_SIGNING.md for how the artifact enters the local stage.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (vX.Y.Z)
        required: true
        type: string
      confirm_sign:
        description: Type the same tag again to confirm signing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sign-release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    outputs:
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      update_key: ${{ steps.build.outputs.update_key }}
      sha256sums: ${{ steps.build.outputs.sha256sums }}
    steps:
      - name: Validate tag and confirmation
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM_SIGN: ${{ inputs.confirm_sign }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must use strict vX.Y.Z form"
            exit 1
          fi
          if [[ "${CONFIRM_SIGN}" != "${TAG}" ]]; then
            echo "::error::confirm_sign must equal the tag exactly"
            exit 1
          fi
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "::error::run this workflow from main, not ${WORKFLOW_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Verify exact tagged source and Go version
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")" || {
            echo "::error::tag ${TAG} does not resolve to a commit"
            exit 1
          }
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "::error::checked-out source does not match tag ${TAG}"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::tagged source checkout is not clean"
            exit 1
          fi
          if [[ "$(go env GOVERSION)" != "go1.27.3" ]]; then
            echo "::error::builder must be go1.27.3, got $(go env GOVERSION)"
            exit 1
          fi
          echo "tag_commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
          echo "Building ${TAG} at ${tag_commit}"

      - name: Build raw binaries
        id: build
        env:
          TAG: ${{ inputs.tag }}
          CGO_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          out_dir="${RUNNER_TEMP}/tag-build"
          mkdir -p "${out_dir}"
          update_key="$(tr -d '[:space:]' < scripts/release/agent-release-public-key.b64)"
          if [[ ! "${update_key}" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::tag public key file is not one base64 Ed25519 public key"
            exit 1
          fi
          targets=(
            "linux amd64 linux-amd64"
            "linux arm64 linux-arm64"
            "windows amd64 windows-amd64.exe"
            "windows arm64 windows-arm64.exe"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch suffix <<< "${target}"
            output="${out_dir}/labtether-agent-${suffix}"
            GOOS="${goos}" GOARCH="${goarch}" go build -mod=readonly -trimpath -buildvcs=true \
              -ldflags="-s -w -X main.version=${TAG} -X main.updatePublicKey=${update_key}" \
              -o "${output}" \
              ./cmd/labtether-agent
            test -s "${output}"
          done
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::build changed the tagged source checkout"
            exit 1
          fi
          {
            echo "update_key=${update_key}"
            echo "sha256sums<<SHA256SUMS_END"
            (
              cd "${out_dir}"
              sha256sum -- labtether-agent-linux-amd64 labtether-agent-linux-arm64 \
                labtether-agent-windows-amd64.exe labtether-agent-windows-arm64.exe
            )
            echo "SHA256SUMS_END"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload binaries for the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tag-build-${{ inputs.tag }}
          path: ${{ runner.temp }}/tag-build/
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Validate tag and workflow branch
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM_SIGN: ${{ inputs.confirm_sign }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "${CONFIRM_SIGN}" != "${TAG}" ]]; then
            echo "::error::tag or confirmation is invalid"
            exit 1
          fi
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "::error::run this workflow from main, not ${WORKFLOW_REF}"
            exit 1
          fi

      - name: Check out the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Compare the tag's public key with the trusted one
        env:
          TAG: ${{ inputs.tag }}
          TAG_UPDATE_KEY: ${{ needs.build.outputs.update_key }}
        run: |
          set -Eeuo pipefail
          trusted_key="$(tr -d '[:space:]' < trusted/scripts/release/agent-release-public-key.b64)"
          if [[ -z "${trusted_key}" || "${trusted_key}" != "${TAG_UPDATE_KEY}" ]]; then
            echo "::error::${TAG} links a different update public key than main; refusing to sign"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Build the trusted signer
        working-directory: trusted
        run: |
          set -Eeuo pipefail
          if [[ "$(go env GOVERSION)" != "go1.27.3" ]]; then
            echo "::error::builder must be go1.27.3, got $(go env GOVERSION)"
            exit 1
          fi
          go build -mod=readonly -o "${RUNNER_TEMP}/sign-release" ./scripts/release/sign-release.go

      - name: Download the build job's binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tag-build-${{ inputs.tag }}
          path: ${{ runner.temp }}/agent-signatures
          digest-mismatch: error

      - name: Check binaries against the build job's SHA-256
        env:
          EXPECTED_SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          set -Eeuo pipefail
          out_dir="${RUNNER_TEMP}/agent-signatures"
          names=(labtether-agent-linux-amd64 labtether-agent-linux-arm64
            labtether-agent-windows-amd64.exe labtether-agent-windows-arm64.exe)
          actual_names="$(cd "${out_dir}" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [[ "${actual_names}" != "$(printf '%s\n' "${names[@]}" | LC_ALL=C sort)" ]]; then
            echo "::error::downloaded build does not hold exactly the four raw binaries"
            exit 1
          fi
          actual_sums="$(cd "${out_dir}" && sha256sum -- "${names[@]}")"
          expected_sums="$(printf '%s\n' "${EXPECTED_SHA256SUMS}")"
          if [[ -z "${expected_sums}" || "${actual_sums}" != "${expected_sums}" ]]; then
            echo "::error::downloaded binaries do not match the build job's SHA-256"
            exit 1
          fi
          printf '%s\n' "${actual_sums}" > "${out_dir}/SHA256SUMS"

      - name: Sign raw binaries
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -z "${RELEASE_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::RELEASE_SIGNING_PRIVATE_KEY is empty; refusing to sign"
            exit 1
          fi
          signing_key="${RELEASE_SIGNING_PRIVATE_KEY}"
          unset RELEASE_SIGNING_PRIVATE_KEY
          expected_public_key="$(tr -d '[:space:]' < trusted/scripts/release/agent-release-public-key.b64)"
          test -n "${expected_public_key}"
          out_dir="${RUNNER_TEMP}/agent-signatures"
          targets=(
            "linux amd64 linux-amd64"
            "linux arm64 linux-arm64"
            "windows amd64 windows-amd64.exe"
            "windows arm64 windows-arm64.exe"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch suffix <<< "${target}"
            raw="${out_dir}/labtether-agent-${suffix}"
            printf '%s' "${signing_key}" | "${RUNNER_TEMP}/sign-release" \
              --version "${TAG}" \
              --os "${goos}" \
              --arch "${goarch}" \
              --binary "${raw}" \
              --out-prefix "${raw}-${TAG}" \
              --expected-public-key "${expected_public_key}" \
              --confirm-sign "${TAG}"
          done
          unset signing_key

      - name: Check artifact contents
        env:
          TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          TRUSTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          out_dir="${RUNNER_TEMP}/agent-signatures"
          expected=(SHA256SUMS)
          for suffix in linux-amd64 linux-arm64 windows-amd64.exe windows-arm64.exe; do
            raw="labtether-agent-${suffix}"
            expected+=("${raw}" "${raw}-${TAG}.sig" "${raw}-${TAG}.metadata.json")
          done
          actual="$(cd "${out_dir}" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          wanted="$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)"
          if [[ "${actual}" != "${wanted}" ]]; then
            echo "::error::artifact folder does not hold exactly the 13 expected files"
            printf 'found:\n%s\n' "${actual}"
            exit 1
          fi
          (cd "${out_dir}" && sha256sum --check --strict SHA256SUMS)
          {
            echo "### Signed ${TAG}"
            echo "Tag commit \`${TAG_COMMIT}\`, signer from \`${TRUSTED_COMMIT}\`."
            echo '```'
            cat "${out_dir}/SHA256SUMS"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload signatures and CI binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-signatures-${{ inputs.tag }}
          path: ${{ runner.temp }}/agent-signatures/
          retention-days: 1
          if-no-files-found: error
