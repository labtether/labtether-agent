[package]
name = "labtether-agent-capabilities"
description = "The LabTether Rust agent's features: one module per device page, each registering its Hub request handlers and what the heartbeat advertises"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
labtether-agent-config.workspace = true
labtether-agent-core.workspace = true
labtether-agent-platform.workspace = true
labtether-agent-security.workspace = true
labtether-protocol.workspace = true

log.workspace = true
serde_json.workspace = true

# Linux only: the Docker page reads the engine over its Unix socket with
# hyper's HTTP/1 client on a tokio Unix stream; the web service page probes
# services with the same client over TCP and rustls (core's TLS settings),
# reads gzip pages as Go's transport does, and names them with SHA-256
# IDs, as Go.
[target.'cfg(target_os = "linux")'.dependencies]
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true

# Test-only: certificates for the stand-in HTTPS services.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
