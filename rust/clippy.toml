# Every process the agent starts goes through
# labtether_agent_security::CommandPolicy::run, which applies the exec
# allowlist, the sanitized child environment, the output limit and the
# timeout. Starting a process anywhere else fails clippy.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "start processes through labtether_agent_security::CommandPolicy::run" },
  { path = "tokio::process::Command::new", reason = "start processes through labtether_agent_security::CommandPolicy::run", allow-invalid = true },
]
